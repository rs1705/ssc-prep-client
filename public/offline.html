<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · EptSSC</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f6fb; --card: #ffffff; --fg: #0e1630; --muted: #56617d; --border: #dbe1ee; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --card: #131a30; --fg: #eef1f8; --muted: #9aa6c6; --border: #252f52; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 2px solid var(--border); border-radius: 24px; padding: 32px 24px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  button { width: 100%; min-height: 48px; border: 2px solid #4338ca; border-bottom-width: 5px; border-radius: 16px; background: #6366f1;
           color: #fff; font: 800 14px/1 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
  button:active { transform: translateY(3px); border-bottom-width: 2px; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>This page hasn't been saved yet. Pages, flashcards, formulas and games you've opened before still work without internet.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
